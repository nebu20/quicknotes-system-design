<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <h1>QuickNotes</h1>
      <p>Create and manage notes using a practice REST API.</p>
    </header>

    <section aria-labelledby="create-heading">
      <h2 id="create-heading">Create a note</h2>
      <form id="note-form">
        <label for="title-input">Title (required, max 100 characters)</label>
        <input id="title-input" name="title" maxlength="100" required>
        <label for="body-input">Note body (optional)</label>
        <textarea id="body-input" name="body" rows="4"></textarea>
        <button id="submit-btn" type="submit">Create note</button>
      </form>
    </section>

    <section aria-labelledby="notes-heading">
      <h2 id="notes-heading">Your notes</h2>
      <button id="load-btn" type="button">Load notes</button>
      <p id="status" role="status" aria-live="polite">Click "Load notes" to begin.</p>
      <ul id="notes-list"></ul>
    </section>
  </main>
</body>
</html>
